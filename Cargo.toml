[package]
name = "math-utils"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_winit",
    "bevy_pbr",
    "bevy_dev_tools",
    "render_dev_tools",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "webgpu",
    "webgl2",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "default_fonts",
    "render",
] }
rand = { version = "0.10.3" }
peg = { version = "0.8.6", default-features = false }