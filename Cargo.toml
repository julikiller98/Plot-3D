[package]
name = "math-utils"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
opt-level = 'z'

[dependencies]
bevy = { version = "0.20.0", features = [
    "bevy_dev_tools",
    "render_dev_tools"
] }
bevy_egui = "0.43.1"
peg = "0.8.5"
rand = "0.10.3"
getrandom = { version = "0.2", features = ["js"] }
